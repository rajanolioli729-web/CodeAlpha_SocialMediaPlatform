<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SocialSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">SocialSphere</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="create-post.html" class="nav-link">Create Post</a>
        <a href="#" id="nav-profile" class="nav-link active">Profile</a>
        <button id="nav-logout" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="profile-layout">
      <div class="card profile-header">
        <div class="profile-cover"></div>
        <div class="profile-info">
          <div class="profile-avatar">
            <img id="profile-image" src="" alt="Profile" onerror="this.src='https://i.pravatar.cc/150?img=1'">
          </div>
          <div class="profile-details">
            <h1 id="profile-username">Loading...</h1>
            <p id="profile-bio" class="profile-bio"></p>
            <div class="profile-stats">
              <div class="stat">
                <span class="stat-number" id="stat-posts">0</span>
                <span class="stat-label">Posts</span>
              </div>
              <div class="stat">
                <span class="stat-number" id="stat-followers">0</span>
                <span class="stat-label">Followers</span>
              </div>
              <div class="stat">
                <span class="stat-number" id="stat-following">0</span>
                <span class="stat-label">Following</span>
              </div>
            </div>
            <div class="profile-actions">
              <button id="follow-btn" class="btn btn-primary" hidden>Follow</button>
              <button id="edit-profile-btn" class="btn btn-outline" hidden>Edit Profile</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card edit-profile-card" id="edit-profile-card" hidden>
        <h2>Edit Profile</h2>
        <form id="edit-profile-form" novalidate>
          <div class="form-group">
            <label for="edit-username">Username</label>
            <input type="text" id="edit-username" name="username" required>
            <span class="error-message" id="edit-username-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-bio">Bio</label>
            <textarea id="edit-bio" name="bio" rows="3" maxlength="500" placeholder="Tell us about yourself"></textarea>
            <span class="error-message" id="edit-bio-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-profile-image">Profile Image URL</label>
            <input type="url" id="edit-profile-image" name="profile_image" placeholder="https://example.com/image.jpg">
            <span class="error-message" id="edit-profile-image-error"></span>
          </div>
          <div class="form-error" id="edit-form-error" hidden></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
            <button type="button" class="btn btn-outline" id="cancel-edit-btn">Cancel</button>
          </div>
        </form>
      </div>

      <div class="profile-posts">
        <h2 class="section-title">Posts</h2>
        <div id="profile-posts-container">
          <div class="loading-spinner" id="profile-posts-loading">
            <div class="spinner"></div>
            <p>Loading posts...</p>
          </div>
        </div>
        <div class="pagination-controls" id="pagination-controls">
          <button id="prev-page" class="btn btn-outline btn-sm" disabled>Previous</button>
          <span id="page-info">Page 1</span>
          <button id="next-page" class="btn btn-outline btn-sm" disabled>Next</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
